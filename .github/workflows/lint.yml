name: lint
on: [pull_request, push]
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
env:
  PREK_COLOR: always
permissions:
  contents: read
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: prek
      - name: Cache prek hooks
        id: cache-prek-hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek|
      - name: Run gitlint
        run: prek run --hook-stage manual gitlint-ci
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure
      - name: Prune prek hooks
        if: steps.cache-prek-hooks.outputs.cache-hit != 'true'
        run: prek cache gc
